name: state-legislature data build

# One-time builds for the state-legislative chamber forecasts (feature branch state-leg). Downloads go to data/raw
# (cached, never committed); only the compact derived tables in data/static/stateleg are committed back to the branch.
# Triggered by a push to the state-leg branch that changes .github/stateleg_step.txt (its first line names the step:
# probe | build | wiki | all | <module>); workflow_dispatch needs the file on the default branch, which this branch must not touch.
on:
  push:
    branches: [state-leg]
    paths: [".github/stateleg_step.txt"]

permissions:
  contents: write

concurrency:
  group: stateleg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt geopandas==1.1.1 pyogrio==0.11.1 shapely==2.1.1 pyarrow pyyaml
      - name: Restore raw cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/stateleg
          key: stateleg-raw-${{ github.run_id }}
          restore-keys: stateleg-raw-
      - name: Run
        run: |
          # every non-comment line of the step file is one step, run in order (a failing step does not stop the next)
          rc=0; first=""
          while read -r STEP rest; do
            case "$STEP" in ''|'#'*) continue ;; esac
            [ -z "$first" ] && first="$STEP"
            echo "::group::$STEP"
            case "$STEP" in
              build) python -m midterms.stateleg_build || rc=1 ;;
              wiki)  python -m midterms.stateleg_wiki || rc=1 ;;
              all)   python -m midterms.stateleg_build || rc=1; python -m midterms.cd_lean_build || rc=1; python -m midterms.stateleg_wiki || rc=1 ;;
              cd)    python -m midterms.cd_lean_build || rc=1 ;;
              *:*)   python -m midterms.${STEP%%:*} $(echo "${STEP#*:}" | tr ',' ' ') || rc=1 ;;
              *)     python -m midterms.$STEP || rc=1 ;;
            esac
            echo "::endgroup::"
          done < .github/stateleg_step.txt
          echo "STEP=$first" >> "$GITHUB_ENV"
          exit $rc
      - name: Drop large downloads before caching (slim extracts are kept)
        if: always()
        run: |
          find data/raw/stateleg -type f \( -name '*.csv' -o -name '*.zip' \) -size +40M -print -delete || true
          du -sh data/raw/stateleg || true
      - name: Save raw cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/stateleg
          key: stateleg-raw-${{ github.run_id }}
      - name: Commit derived tables
        if: ${{ always() && env.STEP != 'probe' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/static/stateleg data/static/cd_lean_2026.csv data/static/qc_cd.json 2>/dev/null || git add -A data/static/stateleg || true
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          du -sh data/static/stateleg
          git commit -q -m "state-leg derived tables ($STEP)"
          for i in 1 2 3; do git pull -q --no-rebase origin state-leg && git push -q origin HEAD:state-leg && exit 0; sleep 5; done
          exit 1

name: early vote diagnostics

# DIAGNOSTIC ONLY - nothing here feeds the forecast or the website, and this workflow never touches the forecast outputs
# (its own concurrency group; it commits data/early/ only, which the site sync does not copy).
#   North Carolina  midterms/nc_early.py: accepted mail / one-stop ballots by self-reported race and ethnicity, 2026 vs
#                   2022 and 2024 on the same days out (NCSBE absentee file, one conditional request per run; the 2022 /
#                   2024 baseline is the committed table data/static/nc_early_baseline.csv). Propensity needs the
#                   2016-2024 generals from NCSBE's voter-history file: reduced once to data/cache/nc_hist_generals.csv.gz
#                   (voter-level, so it stays in the Actions cache - never committed or released) and rebuilt only when
#                   that cache entry is gone (one ~350 MB download).
#   Florida         midterms/fl_early.py: the Division of Elections' party statistics files, one conditional request per
#                   file per run, snapshotted into data/early/fl_stats/ (a missed day is gone: Florida keeps no history);
#                   2024 at matched days out from Wayback captures (data/static/fl_wayback/), registration from
#                   data/static/fl_registration.csv.
#   Georgia         no step: the free official per-voter absentee file has no race, the voter list with race is sold, and
#                   the SOS site and data hub sit behind a browser check.
# NCSBE refreshes the absentee file about 05:15 ET; Florida recompiles through the day. 01:50 UTC = 21:50 ET catches both.
on:
  schedule:
    - cron: "50 1 * * *"
  workflow_dispatch:
    inputs:
      harvest_fl_cache:
        description: "One-time: copy the Florida snapshots the daily forecast run kept in its cache into data/early/fl_stats"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: early-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the daily run's cache (one-time Florida harvest)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.harvest_fl_cache }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
          key: midterms-data-harvest-none
          restore-keys: midterms-data-

      - name: Harvest Florida snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.harvest_fl_cache }}
        run: |
          mkdir -p data/early/fl_stats
          n=0
          for f in data/raw/fl_stats/2*_*.txt; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            if [ ! -e "data/early/fl_stats/$b" ]; then cp "$f" data/early/fl_stats/; n=$((n + 1)); fi
          done
          echo "harvested $n Florida snapshot files"; ls data/early/fl_stats
          rm -rf data/raw data/cache

      - name: Restore the North Carolina voter-history table
        id: nchist
        uses: actions/cache/restore@v4
        with:
          path: data/cache/nc_hist_generals.csv.gz
          key: nc-hist-generals-v1

      - name: Restore early-vote downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/ncsbe
            data/raw/registration/nc
            data/raw/fl_stats
          key: early-raw-${{ github.run_id }}
          restore-keys: early-raw-

      - name: North Carolina by race and ethnicity (diagnostic)
        timeout-minutes: 25
        continue-on-error: true
        run: |
          start=$(date +%s)
          python -m midterms.nc_early || echo "::warning::North Carolina early-vote diagnostic failed (diagnostic only)"
          echo "North Carolina step took $(( $(date +%s) - start )) s"

      - name: Florida by party (diagnostic)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          start=$(date +%s)
          python -m midterms.fl_early || echo "::warning::Florida early-vote diagnostic failed (diagnostic only)"
          echo "Florida step took $(( $(date +%s) - start )) s"

      - name: Save the North Carolina voter-history table
        if: ${{ always() && steps.nchist.outputs.cache-hit != 'true' && hashFiles('data/cache/nc_hist_generals.csv.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache/nc_hist_generals.csv.gz
          key: nc-hist-generals-v1

      - name: Save early-vote downloads
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/ncsbe
            data/raw/registration/nc
            data/raw/fl_stats
          key: early-raw-${{ github.run_id }}

      # Snapshot the outputs, then on each attempt resync to the newest commit of the branch, restore the snapshot, commit and
      # push (no rebase, no merge of stale trees) - the same pattern as the daily forecast's commit step.
      - name: Commit diagnostics
        run: |
          set -uo pipefail
          paths="data/early"
          [ -d data/early ] || { echo "nothing written"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d)
          git add -A -- $paths
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch -q origin "$GITHUB_REF_NAME"; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            tar xf "$SNAP/outs.tar"
            git add -A -- $paths
            if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "Early-vote diagnostics $(date +%F)"
            if timeout 180 git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "pushed on attempt $i"; exit 0; fi
            echo "push $i rejected; resyncing and retrying"; sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"; exit 1

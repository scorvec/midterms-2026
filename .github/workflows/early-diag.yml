name: early vote diagnostics

# Nothing here feeds the forecast, and this workflow never touches the forecast outputs (its own concurrency group). It
# commits data/early/ (the diagnostics below) and web/data/early_vote.json, the data of web/early-vote.html, which the site
# sync publishes with the other midterm pages. midterms/early_page.py reassembles that file from committed data only.
#   North Carolina  midterms/nc_tracker.py, the published tracker: the same morning absentee file (cached: no second
#                   request) by party, age, race, county and vote history against 2018-2024 (data/early/nc_tracker/,
#                   aggregates only); this week's statewide registration file, downloaded only when the board replaces it
#                   (one HEAD request a run against data/early/nc_tracker/reg_2026.json).
#                   midterms/nc_early.py: accepted mail / one-stop ballots by self-reported race and ethnicity, 2026 vs
#                   2022 and 2024 on the same days out (NCSBE absentee file, one conditional request per run; the 2022 /
#                   2024 baseline is the committed table data/static/nc_early_baseline.csv). Propensity needs the
#                   2016-2024 generals from NCSBE's voter-history file: reduced once to data/cache/nc_hist_generals.csv.gz
#                   (voter-level, so it stays in the Actions cache - never committed or released) and rebuilt only when
#                   that cache entry is gone (one ~350 MB download).
#   Florida         midterms/fl_early.py: the Division of Elections' party statistics files, one conditional request per
#                   file per run, snapshotted into data/early/fl_stats/ (a missed day is gone: Florida keeps no history);
#                   2024 at matched days out from Wayback captures (data/static/fl_wayback/), registration from
#                   data/static/fl_registration.csv.
#   Georgia         midterms/ga_early.py: georgiavotes.com's home page once a day (pages are open to crawlers,
#                   /api/ is not and is never used): totals and county counts against 2022 at the same point, race / age /
#                   gender, 2022 behaviour; 2022 at the same day of in-person voting from the Wayback Machine, fetched once into
#                   data/static/ga_wayback_2022.json (gaps: dispatch with ga_wayback_fill). The official per-voter files
#                   have no race or sit behind a browser check.
#   Nevada          midterms/nv_clark_early.py: Clark County only (the Secretary of State's files turn away automated
#                   requests; the county's are open): the nightly mail ballot return file and each day's in-person early
#                   vote file, joined to the county's active voter list for party. The voter-level files stay in the
#                   Actions cache (the voter list under its own key, saved only when the county rewrites it, weekly);
#                   2022 / 2024 are reduced once to the counts in data/static/nv_clark_baseline.csv.
#   Turnout         midterms/turnout_proj.py: every state's ballots so far against 2022 at the same point, as shares of
#                   2022's total and of the citizen voting-age population, and a projected total only where a backtest
#                   allows one (data/early/turnout_proj.json). One server-side count of Pennsylvania's 2026 mail returns on
#                   data.pa.gov a run; its fixed inputs (the FEC's 2008-2024 vote totals, the Census Bureau's CVAP) are
#                   fetched once into data/static/turnout_totals.csv and data/static/cvap.csv.
# NCSBE refreshes the absentee file about 05:15 ET; Florida recompiles through the day. 01:50 UTC = 21:50 ET catches both.
on:
  schedule:
    - cron: "50 1 * * *"
  workflow_dispatch:
    inputs:
      harvest_fl_cache:
        description: "One-time: copy the Florida snapshots the daily forecast run kept in its cache into data/early/fl_stats"
        type: boolean
        default: false
      ga_wayback_fill:
        description: "Try again the Wayback captures of the 2022 Georgia site that are not in data/static/ga_wayback_2022.json yet"
        type: boolean
        default: false
      only:
        description: "Only these states this run (nc, ga, fl, nv, comma-separated; empty = all): a daytime refresh of one state without asking the others' sources again"
        type: string
        default: ""
      turnout_inputs:
        description: "Fetch the turnout table's fixed inputs again (FEC vote totals 2008-2024, Census CVAP)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: early-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the daily run's cache (one-time Florida harvest)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.harvest_fl_cache }}
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw
            data/cache
          key: midterms-data-harvest-none
          restore-keys: midterms-data-

      - name: Harvest Florida snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.harvest_fl_cache }}
        run: |
          mkdir -p data/early/fl_stats
          n=0
          for f in data/raw/fl_stats/2*_*.txt; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            if [ ! -e "data/early/fl_stats/$b" ]; then cp "$f" data/early/fl_stats/; n=$((n + 1)); fi
          done
          echo "harvested $n Florida snapshot files"; ls data/early/fl_stats
          rm -rf data/raw data/cache

      - name: Restore the North Carolina voter-history table
        id: nchist
        uses: actions/cache/restore@v6
        with:
          path: data/cache/nc_hist_generals.csv.gz
          key: nc-hist-generals-v1

      - name: Restore early-vote downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            data/raw/ncsbe
            data/raw/registration/nc
            data/raw/fl_stats
            data/raw/nv_clark/mbreq2026.zip*
            data/raw/nv_clark/ev_2026*
          key: early-raw-${{ github.run_id }}
          restore-keys: early-raw-

      - name: Restore the Clark County voter list
        uses: actions/cache/restore@v6
        with:
          path: data/raw/nv_clark/voters_active.zip*
          key: nv-clark-voters-
          restore-keys: nv-clark-voters-

      - name: North Carolina by race and ethnicity (diagnostic)
        if: ${{ (inputs.only == '' || contains(inputs.only, 'nc')) }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          start=$(date +%s)
          python -m midterms.nc_early || echo "::warning::North Carolina early-vote diagnostic failed (diagnostic only)"
          echo "North Carolina step took $(( $(date +%s) - start )) s"

      - name: North Carolina tracker (the published page)
        if: ${{ (inputs.only == '' || contains(inputs.only, 'nc')) }}
        timeout-minutes: 25
        continue-on-error: true
        run: |
          start=$(date +%s)
          python -m midterms.nc_tracker || echo "::warning::North Carolina tracker failed (the page keeps yesterday's tables)"
          echo "North Carolina tracker took $(( $(date +%s) - start )) s"

      - name: Georgia 2022 baseline from the Wayback Machine (once, gaps on request)
        if: ${{ (hashFiles('data/static/ga_wayback_2022.json') == '' || inputs.ga_wayback_fill) && (inputs.only == '' || contains(inputs.only, 'ga')) }}
        timeout-minutes: 40
        continue-on-error: true
        run: python -m midterms.ga_early wayback || echo "::warning::Georgia 2022 baseline fetch failed (diagnostic only)"

      - name: Georgia composition vs 2022 (diagnostic)
        if: ${{ (inputs.only == '' || contains(inputs.only, 'ga')) }}
        timeout-minutes: 5
        continue-on-error: true
        run: python -m midterms.ga_early || echo "::warning::Georgia early-vote diagnostic failed (diagnostic only)"

      - name: Florida by party (diagnostic)
        if: ${{ (inputs.only == '' || contains(inputs.only, 'fl')) }}
        timeout-minutes: 10
        continue-on-error: true
        run: |
          start=$(date +%s)
          python -m midterms.fl_early || echo "::warning::Florida early-vote diagnostic failed (diagnostic only)"
          echo "Florida step took $(( $(date +%s) - start )) s"

      - name: Clark County, Nevada by party (diagnostic)
        if: ${{ (inputs.only == '' || contains(inputs.only, 'nv')) }}
        timeout-minutes: 15
        continue-on-error: true
        run: python -m midterms.nv_clark_early || echo "::warning::Clark County early-vote diagnostic failed (diagnostic only)"

      - name: Turnout inputs (vote totals, Census CVAP; only what is missing)
        if: ${{ hashFiles('data/static/turnout_totals.csv') == '' || hashFiles('data/static/cvap.csv') == '' || inputs.turnout_inputs }}
        timeout-minutes: 15
        continue-on-error: true
        run: python -m midterms.turnout_proj fetch ${{ inputs.turnout_inputs && '--force' || '' }} || echo "::warning::turnout inputs fetch failed (the turnout table waits for them)"

      - name: Turnout so far (metric)
        timeout-minutes: 5
        continue-on-error: true
        run: python -m midterms.turnout_proj || echo "::warning::turnout table failed (the page keeps yesterday's)"

      # reassembles web/data/early_vote.json from tonight's North Carolina, Georgia, Florida and Clark County readings: no
      # download
      - name: Early-vote page data
        timeout-minutes: 5
        continue-on-error: true
        run: python -m midterms.early_page || echo "::warning::early-vote page data failed (the page keeps yesterday's)"

      - name: Save the North Carolina voter-history table
        if: ${{ always() && steps.nchist.outputs.cache-hit != 'true' && hashFiles('data/cache/nc_hist_generals.csv.gz') != '' }}
        uses: actions/cache/save@v6
        with:
          path: data/cache/nc_hist_generals.csv.gz
          key: nc-hist-generals-v1

      - name: Save early-vote downloads
        if: ${{ always() }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/raw/ncsbe
            data/raw/registration/nc
            data/raw/fl_stats
            data/raw/nv_clark/mbreq2026.zip*
            data/raw/nv_clark/ev_2026*
          key: early-raw-${{ github.run_id }}

      - name: Save the Clark County voter list
        if: ${{ always() && hashFiles('data/raw/nv_clark/voters_active.zip.http.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: data/raw/nv_clark/voters_active.zip*
          key: nv-clark-voters-${{ hashFiles('data/raw/nv_clark/voters_active.zip.http.json') }}

      # Snapshot the outputs, then on each attempt resync to the newest commit of the branch, restore the snapshot, commit and
      # push (no rebase, no merge of stale trees) - the same pattern as the daily forecast's commit step.
      - name: Commit diagnostics
        run: |
          set -uo pipefail
          paths="data/early web/data/early_vote.json data/static/ga_wayback_2022.json"
          [ -e data/static/ga_wayback_2022.json ] || paths="data/early web/data/early_vote.json"
          [ -e data/static/nv_clark_baseline.csv ] && paths="$paths data/static/nv_clark_baseline.csv"
          for f in data/static/turnout_totals.csv data/static/cvap.csv; do [ -e "$f" ] && paths="$paths $f"; done
          [ -e web/data/early_vote.json ] || paths="${paths/ web\/data\/early_vote.json/}"
          [ -d data/early ] || { echo "nothing written"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=$(mktemp -d)
          git add -A -- $paths
          git diff --staged --name-only -z | tar cf "$SNAP/outs.tar" --null -T -
          git reset -q
          for i in 1 2 3 4 5; do
            if ! timeout 120 git fetch -q origin "$GITHUB_REF_NAME"; then echo "fetch $i failed"; sleep 5; continue; fi
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            tar xf "$SNAP/outs.tar"
            git add -A -- $paths
            if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "Early vote $(date +%F)"
            if timeout 180 git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "pushed on attempt $i"; exit 0; fi
            echo "push $i rejected; resyncing and retrying"; sleep $((i * 5))
          done
          echo "::error::push failed after 5 attempts"; exit 1

name: lint

# ruff lint and format check (configuration: ruff.toml). Runs when Python code or the ruff configuration changes.
on:
  push:
    paths:
      - "**.py"
      - "ruff.toml"
  pull_request:
    paths:
      - "**.py"
      - "ruff.toml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.17.1

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .
